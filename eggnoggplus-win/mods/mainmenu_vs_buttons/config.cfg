# Adjust these if your game build/scale puts buttons in the wrong place.
# grid_x / grid_y are native menu grid coordinates used by ui.native_button.
vs_player_grid_x: float, 3.75
vs_ai_grid_x: float, 5.35
grid_y: float, -1.05
layout_x: float, 5.0
