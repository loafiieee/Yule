# Eggnogg+ mod config (v1)
# Format: key: type, value   (or: key: action[, "Label"])

# Upward launch strength for '!' spring tiles (engine: bigger = higher).
spring_strength: float[1,20], 6.0

# Make '_' kill tiles deadly like spikes (also makes the engine avoid spawning
# players on them).
kill_is_deadly: bool, true

# Draw animated colored markers over the custom tiles (green springs, red kills).
show_markers: bool, true

# Log the tile id under player 1 as it changes (for discovering tile ids).
inspect: bool, false
